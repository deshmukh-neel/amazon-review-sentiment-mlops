[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "amazon-review-sentiment-mlops"
version = "0.1.0"
description = "A reproducible Amazon review sentiment pipeline with a production API and GCP deployment."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.12"
authors = [{ name = "Neel Deshmukh" }]
dependencies = [
  "datasets>=5.0.1,<6",
  "fastapi>=0.116,<1",
  "google-cloud-storage>=3.2,<4",
  "joblib>=1.5,<2",
  "numpy>=2.2,<3",
  "pandas>=2.2,<3",
  "pyarrow>=20,<24",
  "pydantic>=2.11,<3",
  "scikit-learn>=1.7,<2",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
reviewsignal = "reviewsignal.cli:app"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reviewsignal"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["reviewsignal"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
extend-exclude = ["legacy", "notebooks"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
